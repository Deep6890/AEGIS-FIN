name: Daily AEGIS-FIN Pipeline

on:
  schedule:
    # 13:00 UTC = 18:30 IST (after NSE market close), weekdays only
    - cron: "0 13 * * 1-5"
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: stack/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r stack/backend/requirements.txt

      - name: Run pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python stack/backend/run_pipeline.py --resume
        working-directory: .

      - name: Train ML model (weekly, Mondays only)
        if: github.event_name == 'schedule' && contains(github.event.schedule, '1-5')
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "1" ]; then
            echo "Monday — training ML model..."
            python stack/backend/ml_engine/train_model.py
          else
            echo "Not Monday — skipping model training"
          fi

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: stack/backend/pipeline_run.log
          retention-days: 30
