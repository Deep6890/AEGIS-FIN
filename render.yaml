services:
  - type: worker
    name: aegis-fin-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler.py
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STORE_BACKEND
        value: supabase
      - key: PIPELINE_HOUR_UTC
        value: "13"
      - key: PIPELINE_MIN_UTC
        value: "0"
      - key: AEGIS_LOG_LEVEL
        value: INFO
      - key: AEGIS_LOG_FORMAT
        value: json
      - key: PYTHONUNBUFFERED
        value: "1"
